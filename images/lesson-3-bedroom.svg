<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">The bedroom</title>
  <desc id="desc">A reconstructed bedroom with a bed on the right, a table on the left, a chair between them under the window, a mirror above the table, clothes behind the bed, two pillows next to each other, two jugs and a cup on the table, and portraits of a man and a woman.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7edf4"/><stop offset="1" stop-color="#c8d5e3"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c5d0dd"/><stop offset="1" stop-color="#879bad"/></linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8cce0"/><stop offset="1" stop-color="#7893ad"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#22344a" flood-opacity=".22"/></filter>
    <style>
      .wood{fill:#647b91;stroke:#3f5369;stroke-width:7;stroke-linejoin:round}
      .line{fill:none;stroke:#40556c;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:#edf3f8;stroke:#677d94;stroke-width:5;stroke-linejoin:round}
      .frame{fill:#edf2f7;stroke:#4d6278;stroke-width:9}
    </style>
  </defs>

  <rect x="25" y="24" width="910" height="672" rx="28" fill="#fff" filter="url(#shadow)"/>
  <path d="M52 52h856v390L52 430z" fill="url(#wall)"/>
  <path d="M52 430l856 12v226H52z" fill="url(#floor)"/>
  <path d="M52 430l150-65 706 77" fill="none" stroke="#72869a" stroke-width="5"/>
  <path d="M97 668l153-232M260 668l75-227M422 668l17-226M585 668l-35-224M748 668l-91-222M52 515l856 12M52 603l856 4" fill="none" stroke="#9cabb8" stroke-width="3" opacity=".75"/>

  <!-- mirror above the table -->
  <rect x="102" y="130" width="142" height="212" rx="5" class="frame"/>
  <rect x="119" y="148" width="108" height="176" rx="50" fill="#a9bdcf" stroke="#6f879c" stroke-width="4"/>
  <path d="M136 172c30 22 49 67 74 127" fill="none" stroke="#dbe6ef" stroke-width="8" opacity=".65"/>

  <!-- window -->
  <rect x="314" y="95" width="232" height="248" class="frame"/>
  <rect x="332" y="113" width="196" height="212" fill="#b9cddd"/>
  <path d="M430 113v212M332 183h196M332 254h196" class="line" stroke-width="5"/>
  <path d="M344 310l61-79 42 29 67-106" fill="none" stroke="#e7f0f7" stroke-width="10" opacity=".65"/>

  <!-- portraits: man on the left of woman -->
  <g transform="translate(650 76)">
    <rect width="94" height="142" class="frame"/>
    <rect x="13" y="13" width="68" height="116" fill="#c0ccd8"/>
    <circle cx="47" cy="49" r="20" fill="#6e8297"/>
    <path d="M20 120c4-35 17-50 27-50s24 15 28 50" fill="#6e8297"/>
  </g>
  <g transform="translate(768 66)">
    <rect width="96" height="150" class="frame"/>
    <rect x="13" y="13" width="70" height="124" fill="#d5dfe8"/>
    <circle cx="48" cy="51" r="20" fill="#8298ab"/>
    <path d="M18 128c7-36 20-52 30-52s25 16 30 52" fill="#8298ab"/>
    <path d="M29 43c8-25 33-25 41 0" fill="none" stroke="#4f657b" stroke-width="8"/>
  </g>

  <!-- table on the left -->
  <path d="M83 401l218-11 20 58-240 10z" class="wood"/>
  <path d="M105 454l-13 170M293 447l23 177M137 516l145-7" class="line"/>
  <!-- two jugs behind the cup -->
  <g transform="translate(143 322)">
    <path d="M16 27h43v79H8V47z" class="soft"/>
    <path d="M59 41c29-5 29 47 0 43" class="line" stroke-width="5"/>
    <path d="M22 13h30v18H22z" class="wood"/>
  </g>
  <g transform="translate(218 331)">
    <path d="M14 24h38v70H7V41z" class="soft"/>
    <path d="M52 36c24-4 24 43 0 38" class="line" stroke-width="5"/>
    <path d="M20 11h26v17H20z" class="wood"/>
  </g>
  <!-- cup in front of the jugs -->
  <g transform="translate(184 396)">
    <path d="M0 0h55l-7 43H8z" fill="#fff" stroke="#40556c" stroke-width="5"/>
    <path d="M53 8c25-4 25 31-2 27" fill="none" stroke="#40556c" stroke-width="5"/>
  </g>

  <!-- chair between table and bed, under the window -->
  <g transform="translate(386 350)">
    <path d="M20 17h126v126H20z" class="wood"/>
    <path d="M20 17v-48M146 17v-48M18 143l-12 177M148 143l22 177M32 176h105" class="line"/>
    <path d="M38 39h90M38 70h90M38 101h90" stroke="#aebfce" stroke-width="10"/>
  </g>

  <!-- clothes behind the bed -->
  <g transform="translate(585 215)">
    <path d="M15 34l37-25 38 25 31 29-24 29-19-14v84H28V78L9 92-15 63z" fill="#667f97" stroke="#3f5369" stroke-width="6"/>
    <path d="M52 9v153M30 55h45" class="line" stroke-width="4"/>
  </g>

  <!-- bed on the right -->
  <path d="M548 351l323 3 35 92-354 6z" fill="#8da6bd" stroke="#40556c" stroke-width="8"/>
  <path d="M553 438l352 4v184l-352 18z" fill="url(#bed)" stroke="#40556c" stroke-width="8"/>
  <path d="M537 318h42v344h-42zM879 310h42v352h-42z" class="wood"/>
  <path d="M558 442c92 44 232 48 343 2" fill="none" stroke="#d7e3ed" stroke-width="10" opacity=".7"/>
  <!-- pillows next to each other -->
  <path d="M620 371c19-29 61-28 83-3l-7 72-92-4z" class="soft"/>
  <path d="M710 368c22-27 65-25 86 2l8 69-98 1z" class="soft"/>
  <path d="M626 405c21-8 46-8 69 1M718 403c22-8 48-7 74 1" fill="none" stroke="#a8b9c9" stroke-width="5"/>
</svg>
