<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
  <title id="title">Alphabet Quiz</title>
  <desc id="desc">Цифровая викторина: нужно вписать букву английского алфавита, название которой звучит как указанное слово. Даны буквы A, O, P, U, Y. Первый пример: my — I.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24324a" flood-opacity="0.14"/>
    </filter>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill:#172033; }
      .muted { fill:#667085; }
      .blue { fill:#3457d5; }
    </style>
  </defs>

  <rect width="720" height="860" rx="34" fill="#eef2f7"/>
  <g opacity="0.17" fill="#172033" class="t" font-weight="900">
    <text x="38" y="110" font-size="72">A</text><text x="160" y="80" font-size="62">B</text><text x="282" y="128" font-size="78">T</text>
    <text x="435" y="90" font-size="68">I</text><text x="558" y="130" font-size="80">R</text>
    <text x="68" y="790" font-size="88">P</text><text x="248" y="820" font-size="72">Q</text><text x="430" y="790" font-size="80">Y</text>
  </g>

  <rect x="72" y="72" width="576" height="716" rx="26" fill="#fff" filter="url(#shadow)"/>
  <rect x="102" y="102" width="516" height="164" rx="22" fill="#f8fafc" stroke="#dce4ef" stroke-width="2"/>

  <text x="360" y="156" text-anchor="middle" class="t blue" font-size="22" font-weight="800" letter-spacing="1.2">ALPHABET</text>
  <text x="360" y="208" text-anchor="middle" class="t" font-size="48" font-weight="850">Quiz</text>
  <text x="360" y="246" text-anchor="middle" class="t muted" font-size="17" font-weight="700">Какая буква звучит как это слово?</text>

  <text x="360" y="322" text-anchor="middle" class="t" font-size="31" font-weight="850" letter-spacing="8">A + O P U Y</text>
  <line x1="132" y1="348" x2="588" y2="348" stroke="#dce4ef" stroke-width="2"/>

  <!-- rows -->
  <g class="t" font-size="25">
    <text x="142" y="409" class="muted" font-size="17" font-weight="850">1</text>
    <text x="184" y="409" font-weight="750">my</text>
    <line x1="350" y1="413" x2="512" y2="413" stroke="#aab5c5" stroke-width="2"/>
    <text x="428" y="404" text-anchor="middle" class="blue" font-weight="900">I</text>
    <text x="542" y="406" class="muted" font-size="14" font-weight="800">пример</text>

    <text x="142" y="474" class="muted" font-size="17" font-weight="850">2</text>
    <text x="184" y="474" font-weight="750">play</text>
    <line x1="350" y1="478" x2="512" y2="478" stroke="#aab5c5" stroke-width="2"/>

    <text x="142" y="539" class="muted" font-size="17" font-weight="850">3</text>
    <text x="184" y="539" font-weight="750">you</text>
    <line x1="350" y1="543" x2="512" y2="543" stroke="#aab5c5" stroke-width="2"/>

    <text x="142" y="604" class="muted" font-size="17" font-weight="850">4</text>
    <text x="184" y="604" font-weight="750">see</text>
    <line x1="350" y1="608" x2="512" y2="608" stroke="#aab5c5" stroke-width="2"/>

    <text x="142" y="669" class="muted" font-size="17" font-weight="850">5</text>
    <text x="184" y="669" font-weight="750">go</text>
    <line x1="350" y1="673" x2="512" y2="673" stroke="#aab5c5" stroke-width="2"/>

    <text x="142" y="734" class="muted" font-size="17" font-weight="850">6</text>
    <text x="184" y="734" font-weight="750">why</text>
    <line x1="350" y1="738" x2="512" y2="738" stroke="#aab5c5" stroke-width="2"/>
  </g>

  <text x="360" y="774" text-anchor="middle" class="t muted" font-size="15">Впиши одну букву в каждую строку.</text>
</svg>
