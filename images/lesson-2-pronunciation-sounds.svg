<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Произношение букв английского алфавита</title>
  <desc id="desc">Цифровая схема упражнения: семь строк со словами-образцами train, tree, egg и boot и группами букв. В первой строке E обведена как пример.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24324a" flood-opacity="0.12"/>
    </filter>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill:#172033; }
      .muted { fill:#667085; }
      .blue { fill:#3457d5; }
      .line { stroke:#dce4ef; stroke-width:2; }
      .row { fill:#ffffff; }
      .pill { fill:#eef2ff; }
      .iconline { stroke:#3457d5; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .iconfill { fill:#e9edff; stroke:#3457d5; stroke-width:4; }
    </style>
  </defs>

  <rect width="720" height="900" rx="34" fill="#f8fafc"/>
  <rect x="28" y="28" width="664" height="844" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="64" y="84" class="t blue" font-size="23" font-weight="800" letter-spacing="1.3">PRONUNCIATION</text>
  <text x="282" y="84" class="t" font-size="23" font-weight="600">the alphabet</text>
  <text x="64" y="124" class="t" font-size="22" font-weight="700">Обведи букву, которая звучит иначе.</text>
  <text x="64" y="154" class="t muted" font-size="17">Слово слева показывает гласный звук для сравнения.</text>

  <!-- header -->
  <rect x="64" y="188" width="592" height="54" rx="14" fill="#f3f6fb"/>
  <text x="86" y="222" class="t muted" font-size="16" font-weight="800">ЗВУК-ОБРАЗЕЦ</text>
  <text x="386" y="222" class="t muted" font-size="16" font-weight="800">БУКВЫ</text>

  <!-- Row 1 -->
  <rect x="64" y="258" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(88 272)">
    <rect x="0" y="18" width="70" height="28" rx="6" class="iconfill"/>
    <rect x="10" y="2" width="26" height="21" rx="4" class="iconfill"/>
    <path d="M4 47h62M16 47a9 9 0 1 0 18 0M48 47a9 9 0 1 0 18 0" class="iconline"/>
  </g>
  <text x="184" y="306" class="t" font-size="25" font-weight="750">train</text>
  <text x="398" y="307" class="t" font-size="27" font-weight="700">A</text>
  <text x="476" y="307" class="t" font-size="27" font-weight="700">K</text>
  <circle cx="563" cy="299" r="25" fill="none" stroke="#3457d5" stroke-width="4"/>
  <text x="554" y="307" class="t blue" font-size="27" font-weight="800">E</text>
  <text x="608" y="307" class="t muted" font-size="14" font-weight="800">пример</text>

  <!-- Row 2 -->
  <rect x="64" y="348" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(94 357)">
    <rect x="24" y="35" width="12" height="27" rx="5" fill="#7c5b40"/>
    <circle cx="30" cy="24" r="22" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
    <circle cx="14" cy="30" r="15" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
    <circle cx="46" cy="30" r="15" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
  </g>
  <text x="184" y="396" class="t" font-size="25" font-weight="750">tree</text>
  <text x="398" y="397" class="t" font-size="27" font-weight="700">G</text>
  <text x="476" y="397" class="t" font-size="27" font-weight="700">V</text>
  <text x="554" y="397" class="t" font-size="27" font-weight="700">R</text>

  <!-- Row 3 -->
  <rect x="64" y="438" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(103 452)">
    <ellipse cx="26" cy="27" rx="21" ry="29" fill="#fff7d8" stroke="#d9a62e" stroke-width="4"/>
    <ellipse cx="26" cy="33" rx="8" ry="10" fill="#f4bb3b"/>
  </g>
  <text x="184" y="486" class="t" font-size="25" font-weight="750">egg</text>
  <text x="398" y="487" class="t" font-size="27" font-weight="700">N</text>
  <text x="476" y="487" class="t" font-size="27" font-weight="700">B</text>
  <text x="554" y="487" class="t" font-size="27" font-weight="700">F</text>

  <!-- Row 4 -->
  <rect x="64" y="528" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(88 542)">
    <rect x="0" y="18" width="70" height="28" rx="6" class="iconfill"/>
    <rect x="10" y="2" width="26" height="21" rx="4" class="iconfill"/>
    <path d="M4 47h62M16 47a9 9 0 1 0 18 0M48 47a9 9 0 1 0 18 0" class="iconline"/>
  </g>
  <text x="184" y="576" class="t" font-size="25" font-weight="750">train</text>
  <text x="398" y="577" class="t" font-size="27" font-weight="700">H</text>
  <text x="476" y="577" class="t" font-size="27" font-weight="700">P</text>
  <text x="554" y="577" class="t" font-size="27" font-weight="700">J</text>

  <!-- Row 5 -->
  <rect x="64" y="618" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(103 632)">
    <ellipse cx="26" cy="27" rx="21" ry="29" fill="#fff7d8" stroke="#d9a62e" stroke-width="4"/>
    <ellipse cx="26" cy="33" rx="8" ry="10" fill="#f4bb3b"/>
  </g>
  <text x="184" y="666" class="t" font-size="25" font-weight="750">egg</text>
  <text x="398" y="667" class="t" font-size="27" font-weight="700">X</text>
  <text x="476" y="667" class="t" font-size="27" font-weight="700">S</text>
  <text x="554" y="667" class="t" font-size="27" font-weight="700">K</text>

  <!-- Row 6 -->
  <rect x="64" y="708" width="592" height="78" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(94 717)">
    <rect x="24" y="35" width="12" height="27" rx="5" fill="#7c5b40"/>
    <circle cx="30" cy="24" r="22" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
    <circle cx="14" cy="30" r="15" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
    <circle cx="46" cy="30" r="15" fill="#dff5df" stroke="#2f8f4e" stroke-width="4"/>
  </g>
  <text x="184" y="756" class="t" font-size="25" font-weight="750">tree</text>
  <text x="398" y="757" class="t" font-size="27" font-weight="700">M</text>
  <text x="476" y="757" class="t" font-size="27" font-weight="700">C</text>
  <text x="554" y="757" class="t" font-size="27" font-weight="700">D</text>

  <!-- Row 7 -->
  <rect x="64" y="798" width="592" height="58" rx="18" class="row" stroke="#e3e8f0" stroke-width="2"/>
  <g transform="translate(101 800)">
    <path d="M9 8h29v31c0 11-6 16-16 16H7V42h9V13H9z" fill="#e9edff" stroke="#3457d5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M38 15h13v20H38" class="iconline"/>
  </g>
  <text x="184" y="837" class="t" font-size="25" font-weight="750">boot</text>
  <text x="398" y="838" class="t" font-size="27" font-weight="700">Q</text>
  <text x="476" y="838" class="t" font-size="27" font-weight="700">I</text>
  <text x="554" y="838" class="t" font-size="27" font-weight="700">U</text>
</svg>
