<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Final -s and -es pronunciation exercise</title>
  <desc id="desc">Six numbered groups of verbs with snake, zebra, and iz pronunciation cues. Watches is circled in the completed example.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#233047" flood-opacity=".12"/>
    </filter>
    <style>
      .heading{font:700 32px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#253248}
      .number{font:700 23px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52647d}
      .cue{font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#384963}
      .word{font:600 23px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26364d}
      .phoneme{font:700 48px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .cell{fill:#fff;stroke:#d6deea;stroke-width:2}
      .divider{stroke:#dfe5ee;stroke-width:2}
    </style>
  </defs>

  <rect x="34" y="30" width="892" height="660" rx="28" fill="url(#paper)" filter="url(#shadow)"/>
  <text x="72" y="85" class="heading">final -s and -es</text>
  <line x1="72" y1="109" x2="888" y2="109" stroke="#53657d" stroke-width="3"/>

  <g transform="translate(72 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">1</text>
    <g transform="translate(25 53)" fill="none" stroke="#52677f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 50c16-34 55-33 61-7 5 21-27 22-42 10-15-12-17-35 3-44 19-9 40 4 40 23"/>
      <circle cx="70" cy="28" r="2.5" fill="#52677f" stroke="none"/>
    </g>
    <text x="64" y="136" text-anchor="middle" class="cue">snake</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">works</text>
    <text x="64" y="284" text-anchor="middle" class="word">laughs</text>
    <ellipse cx="64" cy="352" rx="52" ry="25" fill="none" stroke="#596f8b" stroke-width="4"/>
    <text x="64" y="360" text-anchor="middle" class="word">watches</text>
  </g>

  <g transform="translate(210 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">2</text>
    <g transform="translate(25 53)" fill="none" stroke="#52677f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 50c16-34 55-33 61-7 5 21-27 22-42 10-15-12-17-35 3-44 19-9 40 4 40 23"/>
      <circle cx="70" cy="28" r="2.5" fill="#52677f" stroke="none"/>
    </g>
    <text x="64" y="136" text-anchor="middle" class="cue">snake</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">lives</text>
    <text x="64" y="284" text-anchor="middle" class="word">thinks</text>
    <text x="64" y="353" text-anchor="middle" class="word">drinks</text>
  </g>

  <g transform="translate(348 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">3</text>
    <g transform="translate(26 48) scale(.82)">
      <path d="M11 22h54l17 20-13 43H22L8 57z" fill="#f4f6f8" stroke="#52677f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M25 26l18 55M42 24l18 59M60 28l14 40" stroke="#52677f" stroke-width="5"/>
      <path d="M23 84v15M65 84v15M65 23l6-17 10 5-1 27" fill="none" stroke="#52677f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="78" cy="16" r="2" fill="#52677f"/>
    </g>
    <text x="64" y="136" text-anchor="middle" class="cue">zebra</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">knows</text>
    <text x="64" y="284" text-anchor="middle" class="word">rains</text>
    <text x="64" y="353" text-anchor="middle" class="word">likes</text>
  </g>

  <g transform="translate(486 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">4</text>
    <g transform="translate(26 48) scale(.82)">
      <path d="M11 22h54l17 20-13 43H22L8 57z" fill="#f4f6f8" stroke="#52677f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M25 26l18 55M42 24l18 59M60 28l14 40" stroke="#52677f" stroke-width="5"/>
      <path d="M23 84v15M65 84v15M65 23l6-17 10 5-1 27" fill="none" stroke="#52677f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="78" cy="16" r="2" fill="#52677f"/>
    </g>
    <text x="64" y="136" text-anchor="middle" class="cue">zebra</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">runs</text>
    <text x="64" y="284" text-anchor="middle" class="word">starts</text>
    <text x="64" y="353" text-anchor="middle" class="word">goes</text>
  </g>

  <g transform="translate(624 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">5</text>
    <rect x="17" y="59" width="94" height="66" rx="12" fill="#eef2f7"/>
    <text x="64" y="108" text-anchor="middle" class="phoneme">/ɪz/</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">leaves</text>
    <text x="64" y="284" text-anchor="middle" class="word">dresses</text>
    <text x="64" y="353" text-anchor="middle" class="word">washes</text>
  </g>

  <g transform="translate(762 135)">
    <rect class="cell" width="128" height="500" rx="14"/>
    <text x="64" y="38" text-anchor="middle" class="number">6</text>
    <rect x="17" y="59" width="94" height="66" rx="12" fill="#eef2f7"/>
    <text x="64" y="108" text-anchor="middle" class="phoneme">/ɪz/</text>
    <line x1="14" y1="160" x2="114" y2="160" class="divider"/>
    <text x="64" y="215" text-anchor="middle" class="word">teaches</text>
    <text x="64" y="284" text-anchor="middle" class="word">cooks</text>
    <text x="64" y="353" text-anchor="middle" class="word">uses</text>
  </g>
</svg>
