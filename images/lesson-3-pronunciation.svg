<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Pronunciation chart for schwa and the vowel in bird</title>
  <desc id="desc">The first row shows a computer, the schwa sound, and cardigan as an example. The second row shows a bird, the er sound, and prefer as an example.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dy="10" stdDeviation="12" flood-color="#23334a" flood-opacity=".13"/></filter>
    <style>
      .heading{font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#263850}
      .label{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#344a62}
      .phoneme{font:700 46px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#32465e}
      .example{font:italic 600 27px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6c7e91}
      .cell{fill:#fff;stroke:#d5deea;stroke-width:3}
      .icon{fill:#dce6f0;stroke:#4e647b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="28" y="24" width="704" height="472" rx="28" fill="url(#paper)" filter="url(#shadow)"/>
  <text x="65" y="82" class="heading">/ə/ and /ɜː/</text>
  <line x1="65" y1="106" x2="695" y2="106" stroke="#52677f" stroke-width="3"/>

  <g transform="translate(65 138)">
    <rect class="cell" width="630" height="142" rx="18"/>
    <g transform="translate(28 25)">
      <rect x="0" y="0" width="118" height="72" rx="6" class="icon"/>
      <rect x="14" y="14" width="90" height="44" fill="#fff" stroke="#758ba0" stroke-width="4"/>
      <path d="M47 73v18M71 73v18M28 92h62" fill="none" stroke="#4e647b" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="185" y="63" class="label">computer</text>
    <text x="340" y="82" text-anchor="middle" class="phoneme">/ə/</text>
    <text x="430" y="82" class="example">cardigan</text>
  </g>

  <g transform="translate(65 304)">
    <rect class="cell" width="630" height="142" rx="18"/>
    <g transform="translate(31 25)">
      <path d="M16 63c13-35 40-53 78-44 20 5 29 20 25 37-6 26-42 42-75 31L20 99l8-23z" class="icon"/>
      <path d="M88 22l31-17-6 28" class="icon"/>
      <circle cx="98" cy="30" r="4" fill="#4e647b"/>
      <path d="M49 88v19M70 87v20" fill="none" stroke="#4e647b" stroke-width="6"/>
    </g>
    <text x="185" y="63" class="label">bird</text>
    <text x="340" y="82" text-anchor="middle" class="phoneme">/ɜː/</text>
    <text x="430" y="82" class="example">prefer</text>
  </g>
</svg>
